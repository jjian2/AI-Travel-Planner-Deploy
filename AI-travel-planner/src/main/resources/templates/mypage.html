<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>AI 여행 플래너 - 마이페이지</title>

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/mypage.css">
</head>

<body>

  <div class="app-layout">

    <!-- 왼쪽 사이드바 -->
    <aside class="sidebar">

      <div class="sidebar-logo">
        <img
          src="/images/tiger.png"
          alt="AI 여행 플래너"
          class="sidebar-logo-img">

        <span>AI 여행 플래너</span>
      </div>

      <nav class="sidebar-nav">

        <a
          href="/main"
          class="nav-item"
          data-target="home">

          <span class="nav-icon">🏠</span>
          Home
        </a>

        <div class="nav-group">

          <button
            type="button"
            class="nav-item nav-group-toggle"
            id="scheduleToggle">

            <span class="nav-icon">🗓️</span>
            여행 일정

            <span class="nav-caret">▾</span>
          </button>

          <ul
            class="trip-sublist"
            id="tripList">

            <li
              class="trip-empty"
              id="tripEmptyMsg">
              아직 생성된 여행이 없어요.
            </li>

            <li
              class="trip-add"
              id="tripAddItem">
              + 새 여행 만들기
            </li>
          </ul>
        </div>

        <a
          href="/places"
          class="nav-item"
          data-target="places">

          <span class="nav-icon">📍</span>
          방문 장소
        </a>

        <a
          href="/budget"
          class="nav-item"
          data-target="budget">

          <span class="nav-icon">💰</span>
          여행 가계부
        </a>

        <a
          href="/mypage"
          class="nav-item active"
          data-target="mypage">

          <span class="nav-icon">👤</span>
          마이페이지
        </a>

      </nav>

      <div class="auth-action">

        <!-- 비로그인 사용자 -->
        <a
          th:if="${session.loginUser == null}"
          href="/"
          class="logout-btn">
          로그인
        </a>

        <!-- 로그인 사용자 -->
        <a
          th:if="${session.loginUser != null}"
          href="/logout"
          class="logout-btn">
          로그아웃
        </a>

      </div>

    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="content-area">

      <main class="main-content">

        <!-- 상단 배너 -->
        <section class="page-header">

          <div class="page-overlay">

            <h1>👤 마이페이지</h1>

            <p>
              내 정보를 확인하고 수정할 수 있어요.
            </p>

          </div>

        </section>

        <!-- ==========================================
             비로그인 사용자 안내
             ========================================== -->
        <section
          th:if="${session.loginUser == null}"
          class="mypage-card login-required-card">

          <div class="login-required-icon">
            🔐
          </div>

          <h2>
            로그인이 필요한 페이지입니다
          </h2>

          <p>
            회원정보 수정과 저장한 여행 확인 기능을 이용하려면
            먼저 로그인해주세요.
          </p>

          <a
            href="/"
            class="primary-btn login-required-btn">
            로그인하러 가기
          </a>

        </section>

        <!-- ==========================================
             로그인 사용자 마이페이지
             ========================================== -->
        <div
          class="mypage-grid"
          th:if="${session.loginUser != null}">

          <!-- 프로필 정보 -->
          <div class="mypage-card profile-card">

            <div
              class="profile-avatar-container"
              id="avatarContainer">

              <img
                src="/images/tiger.png"
                alt="프로필 사진"
                id="profileImg">

              <div class="avatar-overlay">
                <span class="camera-icon">📷</span>
                <span>사진 변경</span>
              </div>

              <input
                type="file"
                id="avatarInput"
                accept="image/*"
                style="display: none;">

            </div>

            <form id="profileForm">

              <label>
                이름

                <input
                  type="text"
                  id="profileName"
                  name="name"
                  th:value="${session.loginUser.name}"
                  placeholder="이름"
                  required>
              </label>

              <label>
                아이디

                <input
                  type="text"
                  id="profileId"
                  th:value="${session.loginUser.username}"
                  placeholder="아이디"
                  disabled>
              </label>

              <label>
                이메일

                <input
                  type="email"
                  id="profileEmail"
                  name="email"
                  th:value="${session.loginUser.email}"
                  placeholder="이메일"
                  required>
              </label>

              <div class="button-group-right">

                <button
                  type="submit"
                  class="primary-btn">
                  정보 저장
                </button>

              </div>

              <p
                class="save-msg"
                id="profileSaveMsg">
              </p>

            </form>

          </div>

          <!-- 오른쪽 영역 -->
          <div class="mypage-side">

            <!-- 계정 정보 -->
            <div class="mypage-card">

              <h3>📊 계정 정보</h3>

              <ul class="stat-list">

                <li>
                  <span>가입일</span>

                  <span
                    id="joinDate"
                    th:text="${session.loginUser.createdAt != null
                      ? #temporals.format(
                          session.loginUser.createdAt,
                          'yyyy-MM-dd'
                        )
                      : '-'}">
                    -
                  </span>
                </li>

				<li>
				  <span>만든 여행</span>
				
				  <span
				    id="tripCount"
				    th:text="${tripCount != null ? tripCount + '개' : '0개'}">
				    0개
				  </span>
				</li>

              </ul>

            </div>

            <!-- 비밀번호 변경 -->
            <div class="mypage-card">

              <h3>🔒 비밀번호 변경</h3>

              <form id="passwordForm">

                <input
                  type="password"
                  id="currentPw"
                  name="currentPassword"
                  placeholder="현재 비밀번호"
                  autocomplete="current-password"
                  required>

                <input
                  type="password"
                  id="newPw"
                  name="newPassword"
                  placeholder="새 비밀번호"
                  autocomplete="new-password"
                  required>

                <input
                  type="password"
                  id="newPwConfirm"
                  name="newPasswordConfirm"
                  placeholder="새 비밀번호 확인"
                  autocomplete="new-password"
                  required>

                <p
                  class="field-msg error"
                  id="newPwMismatchMsg">
                </p>

                <div class="button-group-right">

                  <button
                    type="submit"
                    class="primary-btn">
                    비밀번호 저장
                  </button>

                </div>

                <p
                  class="save-msg"
                  id="passwordSaveMsg">
                </p>

              </form>

            </div>

            <!-- 회원 탈퇴 -->
			<div class="delete-account-card">
			    <h3>⚠ 회원 탈퇴</h3>
			
			    <p>
			        탈퇴하면 저장된 여행 일정과 계정 정보가 모두 삭제되며
			        복구할 수 없습니다.
			    </p>
			
			    <button
			        id="withdrawBtn"
			        class="delete-account-btn">
			        회원 탈퇴
			    </button>
			</div>

            </div>

          </div>

        </div>

      </main>

    </div>

  </div>

  <script src="/js/common.js"></script>
  <script src="/js/mypage.js"></script>

</body>

</html>
